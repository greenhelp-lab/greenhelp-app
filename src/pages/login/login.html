<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
 
  <header>
    <!--<img src="img_icons/Vector (1).png" class="Logo1">
    <img src="img_icons/Vector (2).png" class="Logo2">-->
  </header>
  <main class="page">
    <!-- CONTAINER PRINCIPAL (coluna central) -->
    <section class="panel">
      <section style="max-width: 340px; margin: 0 auto; padding: 18px 18px 10px 18px; border-radius: 18px; background: rgba(0,0,0,0.03); box-shadow: 0 4px 16px rgba(0,0,0,0.10);">
        <h1 style="font-size: 22px; margin-bottom: 10px;">Login</h1>
        <p class="lead" style="font-size: 14px; margin-bottom: 18px;">Welcome, GreenHelper!<br>Please, login.</p>
        <form action="" method="post">
          <label for="Email">Email</label>
          <input type="email" id="Email" name="Email" placeholder="Enter your email">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password">
          <a href="reset_password.html" class="forgotten-password"><br>Forgot your password?</a>
          <button type="submit">Login</button>
        </form>
        <p style="font-size: 13px; margin-top: 16px;">Don't have an account? <a href="create_account.html"><br>Create one</a></p>
        <div style="text-align: left; margin-top: 10px;">
          <a href="aboutUs.html" class="botao-voltar"><img src="img_icons/arrow-left.svg" alt="botao-voltar"></a>
        </div>
      </section>
    </section>
  </main>
 
  <footer>
  </footer>
</body>
</html>
