<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
      <main class="page">
  <!-- CONTAINER PRINCIPAL (coluna central) -->
  <section class="panel">

    <div class="popup-container delete-popup">
        <img src="imgs/Vector (3).png" alt="icon-warning">
    <div class="icon-warning"></div> <p class="popup-message">Deletar item?</p>
    <div class="button-group">
        <button class="btn btn-delete">Deletar</button>
        <button class="btn btn-cancel">Não</button>
   </div>
</div>
    <Style>
.delete-popup-page {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #1a1a1a;
    font-family: sans-serif;
}


.delete-popup {
    background-color: #1A1A5A; 
    color: white;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    text-align: center;
    max-width: 320px;
    width: 90%;
}




.popup-message {
    font-size: 1.4em;
    font-weight: bold;
    margin: 15px 0 25px;
}


.button-group {
    display: flex;
    justify-content: space-around;
    gap: 10px;
}

.btn {
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    flex-grow: 1; 
    transition: background-color 0.2s;
}


.btn-delete {
    background-color: #FF3366; 
    color: white;
    border: none;
}


.btn-cancel {
    background-color: transparent;
    color: white;
    border: 2px solid white; 
}
</Style>
</body>
</html>
