<style>
.popup-overlay {
  position: fixed; inset: 0;
  background: rgba(17, 19, 25, 0.6);
  display: flex; justify-content: center; align-items: center;
  z-index: 9999; opacity: 0; visibility: hidden;
  backdrop-filter: blur(2px);
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
.popup-overlay.active { opacity: 1; visibility: visible; }
.popup-box {
  background: var(--panel, #1e1f29);
  border: 1px solid var(--success, #4CAF50);
  border-radius: 16px;
  padding: 2rem; width: 90%; max-width: 400px; text-align: center;
  box-shadow: 0 8px 32px rgba(76, 175, 80, 0.15);
  transform: scale(0.95);
  transition: transform 0.3s ease;
}
.popup-overlay.active .popup-box { transform: scale(1); }
.icon-container { margin-bottom: 1rem; }
.popup-message {
  font-size: 1.25rem; font-weight: 600;
  color: var(--txt, #eaeaea); margin-bottom: 1.5rem;
}
.btn {
  background: var(--success, #4CAF50); color: white; border: none;
  padding: 0.75rem 1.5rem; border-radius: 32px; cursor: pointer;
  font-weight: 500; transition: filter 0.2s ease;
}
.btn:hover { filter: brightness(1.1); }
</style>

<div id="popupUsuario" class="popup-overlay">
  <div class="popup-box">
    <div class="icon-container">
      <svg width="48" height="48" fill="none" stroke="#4CAF50" stroke-width="4" viewBox="0 0 24 24">
        <path d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <p class="popup-message">Usuário cadastrado com sucesso!</p>
    <button class="btn" onclick="closePopupUsuario()">OK</button>
  </div>
</div>

<script>
function showPopupUsuario() {
  document.getElementById('popupUsuario').classList.add('active');
}
function closePopupUsuario() {
  document.getElementById('popupUsuario').classList.remove('active');
}
document.getElementById('popupUsuario').addEventListener('click', e => {
  if (e.target.id === 'popupUsuario') closePopupUsuario();
});
</script>
