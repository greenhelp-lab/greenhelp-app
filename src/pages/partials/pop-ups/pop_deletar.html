    <style>
        .popup-overlay {
            position: fixed;
            inset: 0; 
            background: rgba(17, 19, 25, 0.6); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; 
            opacity: 0;
            visibility: hidden;
            backdrop-filter: blur(2px); 
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .delete-popup {
            background: var(--panel);
            border: 1px solid var(--danger);
            border-radius: 16px;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(250, 71, 122, 0.15);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .popup-overlay.active .delete-popup {
            transform: scale(1);
        }

        .delete-popup .icon-container {
            margin-bottom: 1rem;
        }

        .delete-popup .danger-icon {
            width: 48px;
            height: 48px;
            color: var(--danger);
        }

        .delete-popup .popup-message {
            font-size: 1.25rem;
            font-weight: 600;
            font-family: var(--font-family);
            color: var(--txt);
            margin-bottom: 1.5rem;
        }

        .delete-popup .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .delete-popup .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 32px;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 120px;
        }

        .delete-popup .btn-cancel {
            background: transparent;
            color: var(--txt);
            border: 1px solid var(--muted);
        }

        .delete-popup .btn-cancel:hover {
            background: rgba(166, 167, 211, 0.1);
        }

        .delete-popup .btn-delete {
            background: var(--danger);
            color: white;
        }

        .delete-popup .btn-delete:hover {
            background: #e13d6a;
            box-shadow: 0 0 12px rgba(250, 71, 122, 0.3);
        }

        @media (max-width: 480px) {
            .delete-popup {
                padding: 1.5rem;
            }

            .delete-popup .button-group {
                flex-direction: column;
            }
        }
    </style>

    <!-- Overlay do Pop-up -->

        <div class="delete-popup">

            </div>
            <p class="popup-message">Deletar item?</p>
            <div class="button-group">
                <button class="btn btn-cancel" onclick="closeDeletePopup()">Cancelar</button>
                <button class="btn btn-delete" onclick="confirmDelete()">Deletar</button>
            </div>
        </div>
    </div>

    <script>
        // Função para mostrar o pop-up
        function showDeletePopup() {
            const popup = document.getElementById('deletePopup');
            popup.classList.add('active');
        }

        // Função para fechar o pop-up
        function closeDeletePopup() {
            const popup = document.getElementById('deletePopup');
            popup.classList.remove('active');
        }

        // Função para confirmar a exclusão
        function confirmDelete() {
            // lógica de exclusão aqui
            console.log('Item deletado');
            closeDeletePopup();
        }

        // Fechar o pop-up ao clicar fora dele
        document.getElementById('deletePopup').addEventListener('click', function(event) {
            if (event.target === this) {
                closeDeletePopup();
            }
        });
    </script>
