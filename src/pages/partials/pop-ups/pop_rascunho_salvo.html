<!-- Pop-up para avisar que o rascunho foi salvo -->
<style>
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(17, 19, 25, 0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    backdrop-filter: blur(2px);
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  .popup-overlay.active { opacity: 1; visibility: visible; }

  .popup-box {
    background: var(--panel);
    border: 1px solid var(--info);
    border-radius: 16px;
    padding: 2rem;
    width: 90%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    transform: scale(0.95);
    transition: transform 0.3s ease;
  }
  .popup-overlay.active .popup-box { transform: scale(1); }

  .icon-container { margin-bottom: 1rem; }
  .popup-message { font-size: 1.25rem; font-weight: 600; color: var(--txt); margin-bottom: 1.5rem; }

  .btn {
    padding: 0.75rem 1.5rem;
    border-radius: 32px;
    font-weight: 500;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s ease;
    min-width: 120px;
    background: var(--info);
    color: white;
    border: none;
  }
  .btn:hover { filter: brightness(1.1); }

  :root {
    --info: #2196F3;
    --txt: #eaeaea;
    --panel: #1e1f29;
  }
</style>

<div id="popupRascunhoSalvo" class="popup-overlay">
  <div class="popup-box">
    <div class="icon-container">
      <svg width="48" height="48" fill="none" stroke="#2196F3" stroke-width="4" viewBox="0 0 24 24">
        <path d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <p class="popup-message">Rascunho salvo com sucesso!</p>
    <button class="btn" onclick="closePopupRascunho()">OK</button>
  </div>
</div>

<script>
  function showPopupRascunho() {
    document.getElementById('popupRascunhoSalvo').classList.add('active');
  }
  function closePopupRascunho() {
    document.getElementById('popupRascunhoSalvo').classList.remove('active');
  }
  document.getElementById('popupRascunhoSalvo').addEventListener('click', e => {
    if (e.target.id === 'popupRascunhoSalvo') closePopupRascunho();
  });
</script>
