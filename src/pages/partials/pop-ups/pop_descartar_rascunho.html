<!-- Pop-up para confirmar o descarte do rascunho -->
<style>
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(17, 19, 25, 0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    backdrop-filter: blur(2px);
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  .popup-overlay.active { opacity: 1; visibility: visible; }

  .popup-box {
    background: var(--panel);
    border: 1px solid var(--danger);
    border-radius: 16px;
    padding: 2rem;
    width: 90%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(250, 71, 122, 0.15);
    transform: scale(0.95);
    transition: transform 0.3s ease;
  }
  .popup-overlay.active .popup-box { transform: scale(1); }

  .icon-container { margin-bottom: 1rem; }
  .popup-message { font-size: 1.25rem; font-weight: 600; color: var(--txt); margin-bottom: 1.5rem; }

  .btn {
    padding: 0.75rem 1.5rem;
    border-radius: 32px;
    font-weight: 500;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s ease;
    min-width: 120px;
  }
  .btn-cancel {
    background: transparent;
    color: var(--txt);
    border: 1px solid var(--muted);
  }
  .btn-cancel:hover { background: rgba(166, 167, 211, 0.1); }
  .btn-delete {
    background: var(--danger);
    color: white;
    border: none;
  }
  .btn-delete:hover {
    background: #e13d6a;
    box-shadow: 0 0 12px rgba(250, 71, 122, 0.3);
  }

  :root {
    --danger: #FA477A;
    --muted: #aaa;
    --txt: #eaeaea;
    --panel: #1e1f29;
  }
</style>

<div id="popupDescartar" class="popup-overlay">
  <div class="popup-box">
    <div class="icon-container">
      <svg width="48" height="48" fill="none" stroke="#FA477A" stroke-width="4" viewBox="0 0 24 24">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </div>
    <p class="popup-message">Você quer descartar esse rascunho?</p>
    <div>
      <button class="btn btn-cancel" onclick="closePopupDescartar()">Cancelar</button>
      <button class="btn btn-delete" onclick="confirmDiscard()">Descartar</button>
    </div>
  </div>
</div>

<script>
  function showPopupDescartar() {
    document.getElementById('popupDescartar').classList.add('active');
  }
  function closePopupDescartar() {
    document.getElementById('popupDescartar').classList.remove('active');
  }
  function confirmDiscard() {
    console.log('Rascunho descartado');
    closePopupDescartar();
  }
  document.getElementById('popupDescartar').addEventListener('click', e => {
    if (e.target.id === 'popupDescartar') closePopupDescartar();
  });
</script>
