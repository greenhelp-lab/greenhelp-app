<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="popup-container save-alert-popup">
    <div class="icon-warning">!</div>
    <p class="popup-message">Ei! Vai sair sem salvar?</p>
    <div class="button-group">
        <button class="btn btn-dont-save">Não Salvar</button>
        <button class="btn btn-save">Salvar</button>
   </div>
</div>
    <Style>
    .save-alert-popup-page {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #1a1a1a;
    font-family: sans-serif;
}


.save-alert-popup {
    background-color: #1A1A5A; 
    color: white;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    text-align: center;
    max-width: 320px;
    width: 90%;
}


.save-alert-popup .icon-warning {
    width: 70px;
    height: 60px;
    margin: 10px auto 20px;
    background-color: #FF0000;
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    color: white;
    font-size: 2.5em;
    font-weight: bold;
    line-height: 2.2;
    text-align: center;
}

.save-alert-popup .popup-message {
    font-size: 1.4em;
    font-weight: bold;
    margin: 15px 0 25px;
}


.save-alert-popup .button-group {
    display: flex;
    justify-content: space-around;
    gap: 10px;
}


.btn-dont-save {
    background-color: transparent;
    color: white;
    border: 2px solid #9999FF; 
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    flex-grow: 1;
}


.btn-save {
    background-color: #FF3366;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    flex-grow: 1;
}
</style>
</body>
</html>
