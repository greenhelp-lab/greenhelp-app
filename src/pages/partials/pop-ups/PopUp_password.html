<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <main class="page">
  <!-- CONTAINER PRINCIPAL (coluna central) -->
  <section class="panel">
   <style>
       
        body {
            display: flex;
            flex-direction: column; 
            justify-content: flex-start; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            background-color: #333; 
            font-family: sans-serif;
            box-sizing: border-box;
            padding-top: 50px; 
        }

        
        .success-popup {
            background-color: #313197; 
            color: white; 
            padding: 30px 40px;
            border-radius: 20px; 
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 350px; 
            width: 90%; 
            border: 3px solid #00FF00; 
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
        }

        
        .popup-text {
            font-size: 1.7em; 
            line-height: 1.3; 
            font-weight: bold;
            margin: 5px 0; 
        }

        
        .popup-text.success-word {
            color: #00FF00; 
            display: inline-block; 
        }

        
        .input-section {
            width: 90%;
            max-width: 350px;
            margin-top: 80px; 
            display: flex;
            flex-direction: column;
            gap: 20px; 
        }

        .input-group {
            position: relative;
        }

        .input-label {
            color: #ccc;
            font-size: 0.9em;
            margin-bottom: 5px;
            display: block;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            border: 2px solid #555; 
            border-radius: 10px;
            background-color: #444; 
            color: white;
            font-size: 1em;
            box-sizing: border-box; 
        }

        .input-field:focus {
            outline: none;
            border-color: #00FF00;
        }
    </style>
</head>
<body>

    <div class="success-popup">
        <div class="popup-text">Password</div>
        <div class="popup-text">changed</div>
        <div class="popup-text">with <span class="success-word">success!</p></span></div>
    </div>

   

</body>
</html>
