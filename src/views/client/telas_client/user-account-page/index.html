<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Usuário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top-bar">
    <img src="../images/logo.png" alt="Minha Logo" class="logo">
    <nav class="nav-icons">
      <img src="../images/card.png" alt="Ícone 1">
      <img src="../images/service.png" alt="Ícone 2">
      <img src="../images/home.png" alt="Ícone 3">
    </nav>
  </header>

  <main class="container">
    <h1>Meu Usuário</h1>


    <div class="user-photo">
      <img src="../images/foto_user.png" alt="Alterar foto do usuário">
    </div>

    <form>
      <input type="text" placeholder="Nome Completo">
      <input type="text" placeholder="Cargo">
      <input type="text" placeholder="Perfil">
      <input type="tel" placeholder="Telefone">
      <input type="email" placeholder="Email">
      <input type="password" placeholder="Senha">
      <input type="text" placeholder="ID da Empresa">

      <div class="buttons">
        <button type="button" class="btn trocar">Trocar Conta</button>
        <button type="button" class="btn editar">Editar</button>
        <button type="button" class="btn deletar">Deletar Conta</button>
        <button type="submit" class="btn salvar">Salvar</button>
      </div>
    </form>
  </main>
</body>
</html>
