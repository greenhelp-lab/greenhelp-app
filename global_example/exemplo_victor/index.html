<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criar Registro</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title">Criar Registro</div>
      <button class="close" aria-label="Fechar" onclick="window.alert('Fechar')">✕</button>
    </div>

    <form>
      <div class="field">
        <label for="nome">Nome</label>
        <input id="nome" class="input pill" type="text" placeholder="" />
      </div>

      <div class="field">
        <label for="data">Data de Criação</label>
        <input id="data" class="input pill" type="date" />
      </div>

      <div class="field">
        <label for="status">Status</label>
        <input id="status" class="input pill" type="text" />
      </div>

      <div class="field">
        <label for="statusEdit">Status Última Vez Editado</label>
        <input id="statusEdit" class="input pill" type="text" />
      </div>

      <div class="field">
        <label for="area">Área</label>
        <input id="area" class="input pill" type="text" />
      </div>

      <div class="field">
        <label for="usuarios">Usuários Associados</label>
        <input id="usuarios" class="input pill" type="text" />
      </div>

      <div class="field">
        <label for="empresa">Empresa Associada</label>
        <input id="empresa" class="input pill" type="text" />
      </div>

      <div class="field">
        <label for="id">ID</label>
        <input id="id" class="input pill" type="text" />
      </div>

      <div class="field">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" placeholder=""></textarea>
      </div>

      <div class="footer">
        <button type="button" class="btn btn-descartar">Descartar</button>
        <button type="button" class="btn btn-rascunho">Rascunho</button>
        <button type="submit" class="btn btn-criar">Criar</button>
      </div>
    </form>
  </div>
</body>
</html>
